version: '3.8'

services:
  web:
    build: .
    container_name: creditpulse-loan-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=shadowfox-enterprise-docker-secret-2026
      - FLASK_ENV=production
      - ADMIN_USERNAME=admin
    volumes:
      - ./dataset:/app/dataset
      - ./model:/app/model
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
